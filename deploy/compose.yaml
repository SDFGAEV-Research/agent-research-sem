name: research-platform

services:
  platform-runtime:
    build:
      context: ..
      dockerfile: deploy/Dockerfile
      args:
        NODE_VERSION: ${NODE_VERSION:-22.22.2}
    image: research-platform:local
    init: true
    restart: "no"
    environment:
      MC_SERVER_VERSION: ${MC_SERVER_VERSION:-1.21.8}
      MC_SERVER_JAR: /var/lib/minecraft/server.jar
      MC_WORKDIR: /var/lib/minecraft/t2b-gate
      MC_BRIDGE_DIR: /opt/research-platform/research_platform/environment/minecraft/providers/assets/mineflayer_bridge
      MC_T2B_TIMEOUT_S: ${MC_T2B_TIMEOUT_S:-180}
      PLATFORM_STATE_DIR: /var/lib/research-platform
    ports:
      - "${MC_PORT:-25565}:25565"
    volumes:
      - minecraft-runtime:/var/lib/minecraft
      - platform-state:/var/lib/research-platform
    healthcheck:
      test: ["CMD", "/opt/research-platform/deploy/container-entrypoint.sh", "doctor"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s

volumes:
  minecraft-runtime:
  platform-state:
