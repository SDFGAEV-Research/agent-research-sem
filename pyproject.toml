[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "research-platform"
version = "0.42.6"
requires-python = ">=3.11"

[project.optional-dependencies]
test = ["pytest>=8,<10"]

[project.scripts]
evoctl-next = "research_platform.operator.composition.cli:main"
research-platform-architecture-gate = "research_platform.governance.architecture.gate:main"
research-platform-manage = "research_platform.operator.maintenance.runtime.management_cli:main"
research-platform-algorithm = "research_platform.governance.algorithm.cli:main"
research-platform-concurrency = "research_platform.governance.concurrency.cli:main"
research-platform-performance = "research_platform.governance.performance.cli:main"

[tool.setuptools.packages.find]
include = ["research_platform*", "projects*"]

[tool.setuptools.package-data]
"research_platform.governance.system_registry" = ["catalog.json"]

[tool.pytest.ini_options]
pythonpath = ["."]
testpaths = ["tests"]
